name: BTC SAT Backtest (180 gun)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Kac gunluk geriye donuk test yapilsin"
        required: false
        default: "180"

jobs:
  backtest_sat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: SAT backtest calistir
        run: python backtest_sat.py ${{ github.event.inputs.days }}

      - name: Sonuc dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: sat-backtest-sonuclari
          path: sat_signals_180gun.csv
